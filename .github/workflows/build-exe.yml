name: Build Panel Loop V5 All Cores Input EXE

on:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name PanelLoopV5AllCoresInput Panel_Loop_V5_AllCores_Input.py
      - uses: actions/upload-artifact@v4
        with:
          name: PanelLoopV5AllCoresInput-Windows-EXE
          path: dist/PanelLoopV5AllCoresInput.exe
